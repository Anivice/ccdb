name: Linux Automatic Nightly Build

on:
  workflow_dispatch:    # Enables manual triggering
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            software-properties-common \
            apt-transport-https \
            cmake make musl qemu-user qemu-user-static binfmt-support xxd
          sudo update-binfmts --enable qemu-arm
          sudo update-binfmts --enable qemu-aarch64

      - name: Configure and Build
        run: |
          bash -c 'for arch in x86_64 i686 arm aarch64 armv5l armv7 armv7hf i586; do if ! ./src/configure.sh $arch build_$arch; then exit 1; fi; done' 2>&1 >log.txt

      ########################################################################
      # OPEN ISSUE IF ANY FAILURE OCCURRED
      ########################################################################
      - name: Upload log artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: log.txt
          retention-days: 7

      - name: Open an Issue on Test Failure
        if: ${{ failure() }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            
            const body =
                `# One or more steps have failed!\n\n` +
                `**Log artifact:** \`build-log\` (download it from the workflow run page)\n` +
                `**Workflow run:** ${runUrl}\n`;
                
            await github.rest.issues.create({
                owner, repo,
                title: "CCDB Linux Build Failed",
                body
            });

      - name: Pack
        run: |
          bash -c 'for arch in x86_64 i686 arm aarch64 armv5l armv7 armv7hf i586; do cp build_$arch/ccdb ccdb.$arch; done'

      - name: Get Git commit hash
        id: get_commit
        run: echo "GIT_HASH=$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV

      - name: Set up Git for pushing tag
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Create Git tag for release
        run: |
          git tag "ccdb.NightlyBuild.${{ env.GIT_HASH }}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} "ccdb.NightlyBuild.${{ env.GIT_HASH }}"

      - name: Create a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ccdb.x86_64
            ccdb.i686
            ccdb.arm
            ccdb.aarch64
            ccdb.armv5l
            ccdb.armv7
            ccdb.armv7hf
            ccdb.i586
          tag_name: "ccdb.NightlyBuild.${{ env.GIT_HASH }}"
          prerelease: true  # Marking this as a pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ccdb.NightlyBuild.${{ env.GIT_HASH }}
