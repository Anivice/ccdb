name: Linux Automatic Static Nightly Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  build-and-test:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - i686
          - aarch64
          - armv7hf

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            software-properties-common \
            apt-transport-https \
            cmake \
            make \
            musl \
            qemu-user \
            qemu-user-static \
            binfmt-support \
            xxd \
            git \
            gettext
          
          sudo update-binfmts --enable qemu-arm
          sudo update-binfmts --enable qemu-aarch64
          
          git clone \
            https://github.com/Anivice/ccdb-toolchains \
            toolchains \
            --depth=1

      - name: Configure and Build
        run: |
          ./src/configure.sh \
            "$ARCH" \
            "build_$ARCH" \
            "$PWD/toolchains/toolchains" \
            "$(nproc)" \
            2>&1 | tee "log_$ARCH.txt"

      - name: Upload log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ matrix.arch }}
          path: log_${{ matrix.arch }}.txt

      - name: Open an Issue on Test Failure
        if: ${{ always() && failure() && github.event_name != 'pull_request' }}
        run: |
          gh issue create \
            --title "CCDB Linux Build Failed: ${ARCH}" \
            --body "$(cat <<EOF
          # One or more steps have failed!
          
          **Architecture:** \`${ARCH}\`
          **Log artifact:** \`build-log-${ARCH}\` (download it from the workflow run page)
          **Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          SHORT=$(git rev-parse --short=8 HEAD)
          
          if [ -n "$TAG" ]; then
            echo "GIT_TAG=${TAG}_${ARCH}_static" >> "$GITHUB_ENV"
          else
            echo "GIT_TAG=ccdb.NightlyBuild_${ARCH}_static.${SHORT}" >> "$GITHUB_ENV"
          fi

      - name: Create and push tag
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${GIT_TAG}" >/dev/null; then
            git tag "${GIT_TAG}"
            git push origin "${GIT_TAG}"
          fi

      - name: Create a GitHub release
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          files=(
            "build_${ARCH}/ccdb"
            "build_${ARCH}/ccdb.debug_info"
          )
          
          if gh release view "${GIT_TAG}" >/dev/null 2>&1; then
            gh release upload "${GIT_TAG}" "${files[@]}" --clobber
          else
            gh release create "${GIT_TAG}" "${files[@]}" \
              --title "${GIT_TAG}" \
              --prerelease
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}