name: Windows Automatic Nightly Build for x64

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  build-and-test:
    runs-on: windows-2025
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Configure and Build
        shell: pwsh
        run: |
          & .\src\script\build-windows.cmd Release 2>&1 | Tee-Object -FilePath log-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test
        shell: pwsh
        run: |
          & .\src\out\build\windows-msvc-Release\ccdb.exe --version 2>&1 | Tee-Object -FilePath log-windows.txt -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\src\out\build\windows-msvc-Release\ccdb.exe --help 2>&1 | Tee-Object -FilePath log-windows.txt -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: build-log-windows-x64
          path: log-windows.txt

      - name: Pack
        shell: pwsh
        run: |
          Copy-Item src/out/build/windows-msvc-Release/ccdb.exe ccdb.exe

      - name: Upload executable artifact
        uses: actions/upload-artifact@v6
        with:
          name: ccdb-windows-x64
          path: ccdb.exe
          if-no-files-found: error

      - name: Compute tag
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          SHORT=$(git rev-parse --short=8 HEAD)

          if [ -n "$TAG" ]; then
            echo "GIT_TAG=$TAG" >> "$GITHUB_ENV"
          else
            echo "GIT_TAG=ccdb.NightlyBuild.windows.x64.$SHORT" >> "$GITHUB_ENV"
          fi

      - name: Create and push tag
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          if ! git rev-parse -q --verify "refs/tags/${GIT_TAG}" >/dev/null; then
            git tag "${GIT_TAG}"
            git push origin "${GIT_TAG}"
          fi

      - name: Create a GitHub release
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          files=(
            ccdb.exe
          )

          if gh release view "${GIT_TAG}" >/dev/null 2>&1; then
            gh release upload "${GIT_TAG}" "${files[@]}" --clobber
          else
            gh release create "${GIT_TAG}" "${files[@]}" \
              --title "${GIT_TAG}" \
              --prerelease
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open an Issue on Test Failure
        if: ${{ always() && failure() && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          gh issue create \
            --title "CCDB Windows x64 Build Failed" \
            --body "$(cat <<EOF
          # One or more steps have failed!

          **Log artifact:** \`build-log-windows-x64\` (download it from the workflow run page)
          **Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
