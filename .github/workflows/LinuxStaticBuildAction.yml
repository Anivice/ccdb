name: Linux Automatic Nightly Build

on:
  workflow_dispatch:
  #schedule:
  #  - cron: "0 8 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            software-properties-common \
            apt-transport-https \
            cmake make musl qemu-user qemu-user-static binfmt-support xxd git
          sudo update-binfmts --enable qemu-arm
          sudo update-binfmts --enable qemu-aarch64
          git clone https://github.com/Anivice/ccdb-toolchains toolchains

      - name: Configure and Build
        run: |
          bash -c 'for arch in x86_64 i686 i586 aarch64 armv7 armv7hf; do ./src/configure.sh $arch build_$arch $PWD/toolchains/toolchains; done' \
            2>log.err.txt >log.txt
          cat log.err.txt >> log.txt

      - name: Upload log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: log.txt

      - name: Open an Issue on Test Failure
        if: ${{ always() && failure() && github.event_name != 'pull_request' }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body =
              `# One or more steps have failed!\n\n` +
              `**Log artifact:** \`build-log\` (download it from the workflow run page)\n` +
              `**Workflow run:** ${runUrl}\n`;
            await github.rest.issues.create({ owner, repo, title: "CCDB Linux Build Failed", body });

      - name: Pack
        run: |
          bash -c 'for arch in x86_64 i686 i586 aarch64 armv7 armv7hf; do cp build_$arch/ccdb ccdb.$arch; cp build_$arch/ccdb_packed ccdb_packed.$arch; done'

      - name: Compute tag
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          SHORT=$(git rev-parse --short=8 HEAD)

          if [ -n "$TAG" ]; then
            echo "GIT_TAG=$TAG" >> $GITHUB_ENV
          else
            echo "GIT_TAG=ccdb.NightlyBuild.$SHORT" >> $GITHUB_ENV
          fi

      - name: Create and push tag
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${{ env.GIT_TAG }}" >/dev/null; then
            git tag "${{ env.GIT_TAG }}"
            git push origin "${{ env.GIT_TAG }}"
          fi

      - name: Create a GitHub release
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ccdb.x86_64
            ccdb.i686
            ccdb.i586
            ccdb.aarch64
            ccdb.armv7
            ccdb.armv7hf
          tag_name: "${{ env.GIT_TAG }}"
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ env.GIT_TAG }}